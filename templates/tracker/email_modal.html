<div id="emailModal" class="modal">
    <div class="modal-content large">
        <h2>Prepare Notification Email</h2>
        <p class="subtitle">Review the text below. The secure upload link is included automatically.</p>
        <textarea id="emailEditor" spellcheck="false"></textarea>
        <div class="modal-actions">
            <button class="btn primary" onclick="copyEmail()">Copy to Clipboard</button>
            <button class="btn text" onclick="closeEmailModal()">Close</button>
        </div>
    </div>
</div>
